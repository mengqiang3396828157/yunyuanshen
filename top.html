<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>　</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: #000; padding: 0; }
  .page { border: none; box-shadow: none; background: #000; }
  .finale input[type="text"] {
    background: #111; color: #c8c8c8; border: 1px solid #444;
    font-family: "宋体", SimSun, serif; font-size: 14px;
    padding: 4px 8px; width: 160px;
  }
  .finale button {
    background: #1a1a1a; color: #c8c8c8; border: 1px solid #444;
    font-family: "宋体", SimSun, serif; font-size: 13px;
    padding: 4px 14px; cursor: pointer;
  }
  .finale button.gold {
    color: #ffcc00; border-color: #ffcc00;
  }
</style>
</head>
<body>

<div class="page">
  <div class="finale" id="finale">

    <div class="line" style="animation-delay:0.3s;">你推开天台的门。</div>
    <div class="line" style="animation-delay:1.6s;">水塔的铁梯一共有 46 级。</div>
    <div class="line" style="animation-delay:3.0s;">&nbsp;</div>
    <div class="line" style="animation-delay:3.4s;">上面没有风。</div>
    <div class="line" style="animation-delay:4.6s;">仪表盘还亮着，指针停在 2003 年 4 月 7 日 23 点 16 分。</div>
    <div class="line" style="animation-delay:6.2s;">&nbsp;</div>
    <div class="line" style="animation-delay:6.6s;">一个穿蓝布工装的人背对着你，正在拧一颗螺丝。</div>
    <div class="line" style="animation-delay:8.4s;">他没有回头，说：</div>
    <div class="line" style="animation-delay:9.6s;">&nbsp;</div>
    <div class="line speak" style="animation-delay:10.0s;">"你来接班了？"</div>
    <div class="line speak" style="animation-delay:11.4s;">"先登记。"</div>

    <div class="line sys" style="animation-delay:13.0s;margin-top:26px;">
      ——请输入你的名字。
    </div>

    <div class="line" style="animation-delay:13.4s;margin-top:10px;">
      <input type="text" id="nameInput" maxlength="12" autocomplete="off" placeholder="你的名字">
      <button onclick="submitName()">登记</button>
    </div>

    <div id="choiceBox" style="display:none;margin-top:18px;">
      <button class="gold" onclick="endingC_start()">我不能留下</button>
    </div>

    <div id="boardBox" style="display:none;margin-top:20px;">
      <div class="line sys">——黑板报上那行字，还缺后半句。</div>
      <div style="margin-top:12px;">
        <input type="text" id="boardInput" maxlength="12" autocomplete="off" placeholder="最多 12 字">
        <button class="gold" onclick="endingC_finish()">写上去</button>
      </div>
    </div>

    <div id="result" style="margin-top:22px;"></div>

    <div style="margin-top:60px;text-align:center;font-size:10px;color:#333;font-family:'宋体',SimSun,serif;">
      本页面为虚构创作，与现实中的任何学校、个人、事件无关。
    </div>

  </div>
</div>

<script src="common.js"></script>
<script>
// 读过工单 + 进过黑板 → 显示真结局选项
(function () {
  var hasTearecord = lsGet('tearecord', '0') === '1';
  var hasBlackboard = lsGet('blackboard', '0') === '1';
  if (hasTearecord && hasBlackboard) {
    document.getElementById('choiceBox').style.display = 'block';
  }
})();

function submitName() {
  var name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('请先登记名字。'); return; }

  // 输入"周德明" → 额外文字（不再是结局）
  if (name === '周德明' || name === 'zdez') {
    extraText();
    return;
  }

  endingB(name);
}

// 输入周德明：额外文字，页面不结束
function extraText() {
  var result = document.getElementById('result');
  result.innerHTML =
    '<div class="line" style="color:#e8e8e8;">他拧螺丝的手停了一下。</div>' +
    '<div class="line speak" style="animation-delay:1.2s;">"……你替我把这个拧完。"</div>' +
    '<div class="line speak" style="animation-delay:2.4s;">"我下去看看。"</div>' +
    '<div class="line" style="animation-delay:3.6s;color:#ffcc00;">仪表盘上的数字动了：23 点 17 分。</div>' +
    '<div class="line sys" style="animation-delay:4.8s;">（页面不会结束。你可以再登记一次。）</div>';
}

/* ================= 结局 B《下塔》 ================= */
function endingB(name) {
  var result = document.getElementById('result');
  result.innerHTML =
    '<div class="line" style="color:#e8e8e8;">值班记录已更新。</div>' +
    '<div class="line" style="color:#e8e8e8;animation-delay:1.2s;">' +
    escapeHtml(name) + '，今天 23:16，上塔。</div>' +
    '<div class="line" style="animation-delay:2.6s;">&nbsp;</div>' +
    '<div class="line" style="animation-delay:3.0s;">你回头看了一眼。楼梯还在。天还没亮。</div>' +
    '<div class="line" style="animation-delay:4.4s;">他跟着你下来了。</div>' +
    '<div class="line" style="animation-delay:6.0s;">&nbsp;</div>' +
    '<div class="line" style="animation-delay:6.4s;">第二天早上，食堂开饭。</div>' +
    '<div class="line" style="animation-delay:7.6s;">窗口的阿姨愣了一下，多打了一勺。</div>' +
    '<div class="line speak" style="animation-delay:8.8s;">她说："今天怎么这么多人。"</div>' +
    '<div class="line" style="animation-delay:10.2s;">&nbsp;</div>' +
    '<div class="line" style="animation-delay:10.6s;">监控里，操场上走过去两个人。</div>' +
    '<div class="line" style="animation-delay:11.8s;">其中一个，穿着蓝布工装。</div>' +
    '<div class="line" style="animation-delay:13.4s;color:#ffcc00;">——食堂今天多打了三勺。</div>';

  unlockAch('a21');
  lsSet('ending', 'B');
}

/* ================= 结局 C《刷黑的板书》 ================= */
function endingC_start() {
  document.getElementById('boardBox').style.display = 'block';
  document.getElementById('boardInput').focus();
}

function endingC_finish() {
  var line = document.getElementById('boardInput').value.trim();
  if (!line) { alert('请写下那行字。'); return; }

  lsSet('final_line', line);
  unlockAch('a22');
  lsSet('ending', 'C');
  lsSet('finished', '1');

  var result = document.getElementById('result');
  result.innerHTML =
    '<div class="line speak" style="color:#e8e8e8;">"我不能留下。"</div>' +
    '<div class="line speak" style="color:#e8e8e8;animation-delay:1.2s;">"我把你的班，交给全部人。"</div>' +
    '<div class="line" style="animation-delay:2.6s;">&nbsp;</div>' +
    '<div class="line" style="animation-delay:3.0s;">你在黑板报上写下那行字：</div>' +
    '<div class="line" style="animation-delay:4.0s;color:#fff;font-size:18px;">' +
    escapeHtml(line) + '</div>' +
    '<div class="line" style="animation-delay:5.4s;">粉笔灰落下来，像有人在很远的地方，把灯关了。</div>';

  // 白屏收尾
  setTimeout(function () {
    var w = document.createElement('div');
    w.className = 'whitescreen';
    w.innerHTML =
      '<div>计数器从 0002831 跳到 0000000。</div>' +
      '<div style="margin-top:10px;">滚动公告一条一条消失。</div>' +
      '<div style="margin-top:10px;">今日访问：——　水位：——</div>' +
      '<div style="margin-top:24px;">值班表已归档。最后一条记录：2011 年 4 月 7 日 23:16。</div>' +
      '<div style="margin-top:24px;">第二天早上，食堂开饭。</div>' +
      '<div>窗口的阿姨愣了一下，说："今天怎么这么多人。"</div>' +
      '<div style="margin-top:20px;color:#666;">监控里，操场上走过去三个人：</div>' +
      '<div style="color:#666;">一个蓝布工装，一个校服，一个背影看不清。</div>';
    document.body.appendChild(w);

    setTimeout(function () {
      location.href = 'oldpost.html';
    }, 6000);
  }, 6000);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

document.getElementById('nameInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') submitName();
});

markPage('top');
</script>
</body>
</html>
