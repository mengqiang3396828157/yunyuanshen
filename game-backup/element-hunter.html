<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>元素猎人</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #0a0a14;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Courier New", Consolas, monospace;
    color: #e8e8f0;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  /* ===== 元素切换栏 ===== */
  #elementBar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,10,20,0.95), rgba(10,10,20,0));
    pointer-events: none;
    z-index: 10;
  }

  .elBtn {
    pointer-events: auto;
    width: 58px;
    height: 58px;
    border: 3px solid #333;
    background: #1a1a2e;
    color: #fff;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s, border-color 0.15s, background 0.15s;
  }

  .elBtn:active {
    transform: scale(0.92);
  }

  .elBtn.active {
    border-color: #fff;
    background: #2a2a4a;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3), 0 0 16px currentColor;
  }

  /* ===== 暂停按钮 ===== */
  #pauseBtn {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: 10px;
    width: 44px;
    height: 44px;
    border: 3px solid #444;
    background: rgba(20,20,35,0.9);
    color: #ddd;
    font-size: 18px;
    cursor: pointer;
    z-index: 11;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }

  #pauseBtn:active {
    transform: scale(0.92);
  }

  /* ===== 音效开关 ===== */
  #soundBtn {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: 62px;
    width: 44px;
    height: 44px;
    border: 3px solid #444;
    background: rgba(20,20,35,0.9);
    color: #ddd;
    font-size: 18px;
    cursor: pointer;
    z-index: 11;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }

  #soundBtn:active {
    transform: scale(0.92);
  }

  #soundBtn.off {
    color: #666;
    border-color: #2a2a2a;
  }

  /* ===== 覆盖层（开始/暂停/结束） ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 15, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 24px;
    text-align: center;
    gap: 18px;
  }

  .overlay.hidden {
    display: none;
  }

  .title {
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #ffd76a;
    text-shadow: 3px 3px 0 #8a5a00, 0 0 20px rgba(255,215,106,0.5);
    line-height: 1.4;
  }

  .subtitle {
    font-size: 13px;
    color: #9a9ab0;
    line-height: 2;
    max-width: 340px;
  }

  .subtitle b {
    color: #ffd76a;
  }

  .startBtn {
    margin-top: 8px;
    padding: 14px 40px;
    font-size: 17px;
    font-family: inherit;
    letter-spacing: 2px;
    color: #0a0a14;
    background: #ffd76a;
    border: none;
    border-bottom: 5px solid #a87b00;
    cursor: pointer;
    font-weight: bold;
  }

  .startBtn:active {
    transform: translateY(3px);
    border-bottom-width: 2px;
  }

  .statRow {
    font-size: 15px;
    color: #ccc;
    line-height: 1.9;
  }

  .statRow span {
    color: #ffd76a;
    font-weight: bold;
  }

  /* ===== 彩蛋视频层 ===== */
  #eggLayer {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.96);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
  }

  #eggLayer.show {
    display: flex;
  }

  #eggVideo {
    width: 92%;
    max-width: 900px;
    max-height: 80vh;
    background: #000;
    border: 4px solid #ffd76a;
    box-shadow: 0 0 40px rgba(255,215,106,0.6);
    animation: eggIn 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
  }

  @keyframes eggIn {
    0% { transform: scale(0.2) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.06) rotate(1deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ===== 加载提示 ===== */
  #notice {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 22px;
    background: rgba(58, 42, 18, 0.96);
    border: 2px solid #6b4a1a;
    color: #ffd79a;
    font-size: 13px;
    line-height: 1.8;
    display: none;
    z-index: 40;
    max-width: 88vw;
  }

  #notice.show {
    display: block;
  }

  /* ===== 横屏提示 ===== */
  #rotateHint {
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 15, 0.97);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    gap: 20px;
    color: #ffd76a;
    font-size: 15px;
    letter-spacing: 2px;
    text-align: center;
    padding: 24px;
  }

  #rotateHint.show {
    display: flex;
  }

  #rotateHint .phone {
    font-size: 52px;
    animation: rotatePhone 1.6s ease-in-out infinite;
  }

  @keyframes rotatePhone {
    0%, 40% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(90deg); }
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <button id="pauseBtn">❚❚</button>
  <button id="soundBtn">🔊</button>

  <div id="elementBar">
    <button class="elBtn" data-el="0">🔥</button>
    <button class="elBtn" data-el="1">💧</button>
    <button class="elBtn" data-el="2">⚡</button>
    <button class="elBtn" data-el="3">❄️</button>
  </div>

  <!-- 开始界面 -->
  <div class="overlay" id="startScreen">
    <div class="title">元素猎人</div>
    <div class="subtitle">
      <b>左半屏拖动</b> 移动角色<br>
      <b>底部按钮</b> 切换元素<br>
      攻击自动进行，用<b>克制元素</b>打出 3 倍伤害<br>
      <br>
      火 🔥 → 冰 ❄️ → 雷 ⚡ → 水 💧 → 火 🔥
    </div>
    <button class="startBtn" id="startBtn">开 始 游 戏</button>
  </div>

  <!-- 暂停界面 -->
  <div class="overlay hidden" id="pauseScreen">
    <div class="title">暂 停</div>
    <button class="startBtn" id="resumeBtn">继 续</button>
  </div>

  <!-- 结束界面 -->
  <div class="overlay hidden" id="overScreen">
    <div class="title">游戏结束</div>
    <div class="statRow">
      到达层数：<span id="finalFloor">1</span><br>
      击败敌人：<span id="finalKills">0</span><br>
      最终得分：<span id="finalScore">0</span><br>
      最高连击：<span id="finalCombo">0</span>
    </div>
    <button class="startBtn" id="restartBtn">再 来 一 次</button>
  </div>

  <!-- 彩蛋视频层 -->
  <div id="eggLayer">
    <video id="eggVideo" src="yunyuanshen.mp4" playsinline preload="metadata"></video>
  </div>

  <div id="notice">
    ⚠️ 视频加载失败，请确认 <b>yunyuanshen.mp4</b> 与网页在同一目录。
  </div>

  <!-- 横屏提示 -->
  <div id="rotateHint">
    <div class="phone">📱</div>
    <div>请竖屏游玩</div>
  </div>

<script>
(function () {
  'use strict';

  /* ========================================================
     音效系统（Web Audio API 合成，无需音频文件）
     ======================================================== */
  const Sound = (function () {
    let actx = null;
    let masterGain = null;
    let enabled = true;
    let unlocked = false;

    function init() {
      if (actx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { enabled = false; return; }
      actx = new AC();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(actx.destination);
    }

    // 首次用户交互时解锁音频（浏览器策略要求）
    function unlock() {
      init();
      if (!actx) return;
      if (actx.state === 'suspended') {
        actx.resume().then(() => { unlocked = true; }).catch(() => {});
      } else {
        unlocked = true;
      }
    }

    // 基础音：指定频率、时长、波形、音量
    function tone(freq, dur, type, vol, freqEnd) {
      if (!enabled || !actx || !unlocked) return;
      const t = actx.currentTime;
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (freqEnd) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + dur);
      }
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime((vol || 0.3), t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    // 噪声（爆炸/受击）
    function noise(dur, vol, filterFreq) {
      if (!enabled || !actx || !unlocked) return;
      const t = actx.currentTime;
      const len = Math.floor(actx.sampleRate * dur);
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      }
      const src = actx.createBufferSource();
      src.buffer = buf;
      const filter = actx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = filterFreq || 1200;
      const g = actx.createGain();
      g.gain.setValueAtTime(vol || 0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(masterGain);
      src.start(t);
      src.stop(t + dur + 0.02);
    }

    return {
      unlock: unlock,
      get enabled() { return enabled; },
      setEnabled(v) { enabled = v; if (masterGain) masterGain.gain.value = v ? 0.35 : 0; },
      get ready() { return !!actx && unlocked; },

      // 射击
      shoot() { tone(760, 0.06, 'square', 0.10, 420); },
      // 命中敌人
      hit() { tone(320, 0.05, 'square', 0.12, 180); },
      // 克制命中（更亮）
      superHit() { tone(980, 0.09, 'sawtooth', 0.14, 1400); },
      // 击杀
      kill() { tone(520, 0.12, 'square', 0.16, 880); },
      // 玩家受伤
      hurt() { tone(180, 0.22, 'sawtooth', 0.22, 70); noise(0.18, 0.18, 600); },
      // 切换元素
      switchEl() { tone(660, 0.05, 'triangle', 0.12, 880); },
      // 过关
      floorUp() {
        tone(523, 0.10, 'square', 0.16);
        setTimeout(() => tone(659, 0.10, 'square', 0.16), 90);
        setTimeout(() => tone(784, 0.16, 'square', 0.18), 180);
      },
      // 彩蛋触发
      egg() {
        tone(523, 0.12, 'triangle', 0.18);
        setTimeout(() => tone(659, 0.12, 'triangle', 0.18), 110);
        setTimeout(() => tone(784, 0.12, 'triangle', 0.18), 220);
        setTimeout(() => tone(1046, 0.30, 'triangle', 0.22), 330);
      },
      // 游戏结束
      over() {
        tone(392, 0.18, 'sawtooth', 0.18);
        setTimeout(() => tone(330, 0.18, 'sawtooth', 0.18), 160);
        setTimeout(() => tone(262, 0.40, 'sawtooth', 0.20), 320);
      },
      // 开始游戏
      start() {
        tone(440, 0.08, 'square', 0.16);
        setTimeout(() => tone(660, 0.14, 'square', 0.18), 80);
      }
    };
  })();

  /* ========================================================
     基础设置
     ======================================================== */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // 逻辑分辨率（游戏逻辑基于此，与设备无关）
  // 用「基准宽度」换算，保证逻辑宽高比与屏幕完全一致，不会拉伸变形
  const BASE_W = 400;
  let W = BASE_W;
  let H = 700;

  // UI 安全区（HUD 高度 / 底部元素栏高度），在 resize 中更新
  const UI = { top: 46, bottom: 80 };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = window.innerWidth;
    const ch = window.innerHeight;

    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);

    // 逻辑尺寸：固定逻辑宽度为 BASE_W，高度按屏幕比例换算
    // 这样不同设备上「一个像素块占屏幕的比例」才一致，视觉统一
    W = BASE_W;
    H = Math.round(BASE_W * (ch / cw));

    // 极端比例兜底（超宽/超长屏），仍保持比例不变
    if (H < 400) {
      H = 400;
      W = Math.round(H * (cw / ch));
    } else if (H > 1100) {
      H = 1100;
      W = Math.round(H * (cw / ch));
    }

    // 记录 UI 安全边距（HUD 高度 / 底部元素栏高度），供边界计算使用
    UI.top = 46;
    UI.bottom = 80;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(canvas.width / W, canvas.height / H);
    ctx.imageSmoothingEnabled = false;

    // 手机横屏时提示旋转（宽 > 高 且 高度较小）
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    const isLandscape = cw > ch && ch < 560;
    const rotateHint = document.getElementById('rotateHint');
    if (rotateHint) {
      rotateHint.classList.toggle('show', isMobile && isLandscape);
    }
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  /* ========================================================
     元素系统
     ======================================================== */
  const ELEMENTS = [
    { name: '火', icon: '🔥', color: '#ff5a3c', glow: '#ffb08a' },
    { name: '水', icon: '💧', color: '#3ca0ff', glow: '#8ad0ff' },
    { name: '雷', icon: '⚡', color: '#b45aff', glow: '#d9a8ff' },
    { name: '冰', icon: '❄️', color: '#5ae0e0', glow: '#a8f0f0' }
  ];

  // 相克链：火(0) → 冰(3) → 雷(2) → 水(1) → 火(0)
  const COUNTER = { 0: 3, 3: 2, 2: 1, 1: 0 };

  function damageMultiplier(attacker, defender) {
    if (COUNTER[attacker] === defender) return 3;      // 克制
    if (COUNTER[defender] === attacker) return 0.3;    // 被克
    return 1;
  }

  /* ========================================================
     游戏状态
     ======================================================== */
  const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, EGG: 3, OVER: 4 };
  let state = STATE.MENU;

  const game = {
    floor: 1,
    timeLeft: 30,
    score: 0,
    kills: 0,
    combo: 0,
    maxCombo: 0,
    hp: 3,
    maxHp: 3,
    currentEl: 0,
    eggTriggered: false,
    buffActive: false,
    shake: 0,
    flash: 0,
    time: 0
  };

  /* ========================================================
     实体
     ======================================================== */
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let floatTexts = [];

  function createPlayer() {
    return {
      x: W / 2,
      y: H * 0.62,
      r: 9,
      speed: 4.2,
      targetX: W / 2,
      targetY: H * 0.62,
      fireCd: 0,
      invuln: 0,
      hitFlash: 0
    };
  }

  /* ========================================================
     敌人生成
     ======================================================== */
  const ENEMY_TYPES = [
    { id: 'slime', hp: 3,  r: 11, speed: 0.9, score: 10, fixedColor: null, shield: 0, shooter: false },
    { id: 'mage',  hp: 5,  r: 13, speed: 0.7, score: 25, fixedColor: null, shield: 3, shooter: false },
    { id: 'ruin',  hp: 10, r: 15, speed: 0.55, score: 40, fixedColor: '#9a9ab0', shield: 0, shooter: true },
    { id: 'brute', hp: 4,  r: 10, speed: 1.6, score: 20, fixedColor: null, shield: 0, shooter: false }
  ];

  let spawnTimer = 0;
  let spawnInterval = 1.4;

  function spawnEnemy() {
    // 随层数提升难度（渐进解锁敌人类型）
    const f = game.floor;
    let pool = ['slime'];
    if (f >= 2) pool.push('brute');
    if (f >= 3) pool.push('slime', 'brute');
    if (f >= 4) pool.push('mage');
    if (f >= 6) pool.push('ruin');
    if (f >= 8) pool.push('mage', 'ruin');

    const typeId = pool[Math.floor(Math.random() * pool.length)];
    const tpl = ENEMY_TYPES.find(t => t.id === typeId);

    // 从屏幕外边缘生成
    const side = Math.floor(Math.random() * 4);
    let x, y;
    const m = 30;
    if (side === 0) { x = Math.random() * W; y = -m; }
    else if (side === 1) { x = W + m; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = H + m; }
    else { x = -m; y = Math.random() * H; }

    // 遗迹守卫无元素，其余随机元素
    const el = tpl.fixedColor ? -1 : Math.floor(Math.random() * 4);
    const hpScale = 1 + (f - 1) * 0.22;

    enemies.push({
      type: typeId,
      x, y,
      r: tpl.r,
      hp: Math.ceil(tpl.hp * hpScale),
      maxHp: Math.ceil(tpl.hp * hpScale),
      speed: tpl.speed * (1 + (f - 1) * 0.04),
      score: tpl.score,
      el: el,
      shield: tpl.shield ? Math.ceil(tpl.shield * hpScale) : 0,
      maxShield: tpl.shield ? Math.ceil(tpl.shield * hpScale) : 0,
      shooter: tpl.shooter,
      shootCd: 1.5 + Math.random() * 1.5,
      hitFlash: 0,
      wobble: Math.random() * Math.PI * 2
    });
  }

  function spawnEnemyBullet(x, y, tx, ty) {
    const a = Math.atan2(ty - y, tx - x);
    const sp = 2.4;
    bullets.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      r: 4,
      el: -1,
      dmg: 1,
      fromEnemy: true,
      life: 4
    });
  }

  /* ========================================================
     粒子 / 飘字
     ======================================================== */
  function burst(x, y, color, count, spread) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * (spread || 3) + 0.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.4,
        maxLife: 0.8,
        color,
        size: Math.random() < 0.5 ? 2 : 3
      });
    }
  }

  function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
  }

  /* ========================================================
     输入
     ======================================================== */
  const input = {
    moveActive: false,
    moveTouchId: null,
    moveStartX: 0,
    moveStartY: 0,
    playerStartX: 0,
    playerStartY: 0
  };

  function screenToLogic(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) / rect.width * W,
      y: (clientY - rect.top) / rect.height * H
    };
  }

  function onTouchStart(e) {
    if (state !== STATE.PLAYING) return;
    for (const t of e.changedTouches) {
      const p = screenToLogic(t.clientX, t.clientY);
      // 左半屏作为移动摇杆
      if (p.x < W / 2 && !input.moveActive) {
        input.moveActive = true;
        input.moveTouchId = t.identifier;
        input.moveStartX = p.x;
        input.moveStartY = p.y;
        input.playerStartX = player.x;
        input.playerStartY = player.y;
      }
    }
  }

  function onTouchMove(e) {
    if (state !== STATE.PLAYING || !input.moveActive) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== input.moveTouchId) continue;
      const p = screenToLogic(t.clientX, t.clientY);
      const dx = p.x - input.moveStartX;
      const dy = p.y - input.moveStartY;
      player.targetX = input.playerStartX + dx * 1.5;
      player.targetY = input.playerStartY + dy * 1.5;
    }
    e.preventDefault();
  }

  function onTouchEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === input.moveTouchId) {
        input.moveActive = false;
        input.moveTouchId = null;
      }
    }
  }

  canvas.addEventListener('touchstart', onTouchStart, { passive: true });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: true });
  canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

  // 电脑端：鼠标移动控制
  canvas.addEventListener('mousemove', (e) => {
    if (state !== STATE.PLAYING) return;
    const p = screenToLogic(e.clientX, e.clientY);
    player.targetX = p.x;
    player.targetY = p.y;
  });

  // 键盘
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === STATE.PLAYING) cycleElement();
    }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === STATE.PLAYING) pauseGame();
      else if (state === STATE.PAUSED) resumeGame();
    }
    if (e.code === 'Digit1') setElement(0);
    if (e.code === 'Digit2') setElement(1);
    if (e.code === 'Digit3') setElement(2);
    if (e.code === 'Digit4') setElement(3);
  });

  /* ========================================================
     元素切换
     ======================================================== */
  const elBtns = document.querySelectorAll('.elBtn');

  function setElement(i) {
    if (game.currentEl !== i) Sound.switchEl();
    game.currentEl = i;
    elBtns.forEach((b, idx) => b.classList.toggle('active', idx === i));
  }

  function cycleElement() {
    setElement((game.currentEl + 1) % 4);
  }

  elBtns.forEach((btn, i) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setElement(i);
    });
  });

  /* ========================================================
     游戏流程
     ======================================================== */
  const startScreen = document.getElementById('startScreen');
  const pauseScreen = document.getElementById('pauseScreen');
  const overScreen = document.getElementById('overScreen');
  const eggLayer = document.getElementById('eggLayer');
  const eggVideo = document.getElementById('eggVideo');
  const notice = document.getElementById('notice');

  function startGame() {
    game.floor = 1;
    game.timeLeft = 30;
    game.score = 0;
    game.kills = 0;
    game.combo = 0;
    game.maxCombo = 0;
    game.hp = 3;
    game.eggTriggered = false;
    game.buffActive = false;
    game.shake = 0;
    game.flash = 0;
    game.time = 0;
    Sound.unlock();

    player = createPlayer();
    enemies = [];
    bullets = [];
    particles = [];
    floatTexts = [];
    spawnTimer = 0.8;
    spawnInterval = 1.4;

    setElement(0);
    state = STATE.PLAYING;
    Sound.start();

    startScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
  }

  function pauseGame() {
    state = STATE.PAUSED;
    pauseScreen.classList.remove('hidden');
  }

  function resumeGame() {
    state = STATE.PLAYING;
    pauseScreen.classList.add('hidden');
  }

  function gameOver() {
    state = STATE.OVER;
    Sound.over();
    document.getElementById('finalFloor').textContent = game.floor;
    document.getElementById('finalKills').textContent = game.kills;
    document.getElementById('finalScore').textContent = game.score;
    document.getElementById('finalCombo').textContent = game.maxCombo;
    overScreen.classList.remove('hidden');
  }

  function nextFloor() {
    game.floor++;
    game.timeLeft = 30;
    game.hp = Math.min(game.hp + 1, game.maxHp);
    spawnInterval = Math.max(0.62, 1.4 - (game.floor - 1) * 0.075);
    addFloatText(W / 2, H / 2, '第 ' + game.floor + ' 层', '#ffd76a');
    game.flash = 0.6;
    Sound.floorUp();
  }

  /* ========================================================
     彩蛋
     ======================================================== */
  function triggerEgg() {
    state = STATE.EGG;
    game.eggTriggered = true;
    game.flash = 1;
    Sound.egg();

    // 清场
    enemies = [];
    bullets = [];
    burst(player.x, player.y, '#ffd76a', 60, 6);

    setTimeout(() => {
      eggLayer.classList.add('show');
      eggVideo.currentTime = 0;
      // 先尝试带声音播放（玩家已有交互，通常允许）
      eggVideo.muted = false;
      eggVideo.volume = 1;
      playEggWithSound();
    }, 600);
  }

  // 尝试带声音播放，失败则静音播放
  function playEggWithSound() {
    const p = eggVideo.play();
    if (!p || !p.catch) return;
    p.catch(() => {
      // 带声音被拦截 → 先静音播放，用户点击视频即可开启声音
      eggVideo.muted = true;
      eggVideo.play().catch(() => {});
    });
  }

  function closeEgg() {
    if (state !== STATE.EGG) return;
    eggVideo.pause();
    eggLayer.classList.remove('show');
    game.buffActive = true;
    game.hp = game.maxHp;
    addFloatText(W / 2, H / 2, '元素共鸣！伤害 ×2', '#ffd76a');
    game.flash = 0.8;
    state = STATE.PLAYING;
  }

  eggVideo.addEventListener('ended', closeEgg);

  // 点击视频：静音时先开声音，有声音时跳过
  eggVideo.addEventListener('click', (e) => {
    e.stopPropagation();
    if (eggVideo.muted) {
      eggVideo.muted = false;
      eggVideo.volume = 1;
    } else {
      closeEgg();
    }
  });

  // 点击视频以外区域：跳过
  eggLayer.addEventListener('click', closeEgg);

  eggVideo.addEventListener('error', () => {
    notice.classList.add('show');
    setTimeout(() => notice.classList.remove('show'), 3000);
    closeEgg();
  });

  /* ========================================================
     更新逻辑
     ======================================================== */
  function update(dt) {
    game.time += dt;

    if (state === STATE.PLAYING) {
      updatePlaying(dt);
    }

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const f = floatTexts[i];
      f.y -= dt * 30;
      f.life -= dt;
      if (f.life <= 0) floatTexts.splice(i, 1);
    }

    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 4);
    if (game.flash > 0) game.flash = Math.max(0, game.flash - dt * 2.5);
  }

  function updatePlaying(dt) {
    /* ---- 倒计时 ---- */
    game.timeLeft -= dt;
    if (game.timeLeft <= 0) {
      nextFloor();
      return;
    }

    /* ---- 玩家移动 ---- */
    const dx = player.targetX - player.x;
    const dy = player.targetY - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 1) {
      const move = Math.min(player.speed * dt * 60, dist);
      player.x += (dx / dist) * move;
      player.y += (dy / dist) * move;
    }
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r + UI.top, Math.min(H - player.r - UI.bottom, player.y));

    if (player.invuln > 0) player.invuln -= dt;
    if (player.hitFlash > 0) player.hitFlash -= dt;

    /* ---- 自动射击 ---- */
    player.fireCd -= dt;
    if (player.fireCd <= 0 && enemies.length > 0) {
      let nearest = null, nd = Infinity;
      for (const e of enemies) {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < nd) { nd = d; nearest = e; }
      }
      if (nearest) {
        const a = Math.atan2(nearest.y - player.y, nearest.x - player.x);
        const sp = 7;
        bullets.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          r: 3,
          el: game.currentEl,
          dmg: 1,
          fromEnemy: false,
          life: 3
        });
        player.fireCd = 0.22;
        Sound.shoot();
      }
    }

    /* ---- 生成敌人 ---- */
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = spawnInterval * (0.7 + Math.random() * 0.6);
    }

    /* ---- 敌人更新 ---- */
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      e.x += Math.cos(a) * e.speed * dt * 60;
      e.y += Math.sin(a) * e.speed * dt * 60;
      e.wobble += dt * 6;
      if (e.hitFlash > 0) e.hitFlash -= dt;

      // 遗迹守卫射击
      if (e.shooter) {
        e.shootCd -= dt;
        if (e.shootCd <= 0 && Math.hypot(e.x - player.x, e.y - player.y) < 300) {
          spawnEnemyBullet(e.x, e.y, player.x, player.y);
          e.shootCd = 2.2;
        }
      }

      // 撞到玩家
      if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r) {
        if (player.invuln <= 0) {
          damagePlayer();
          if (state === STATE.OVER) return;
        }
        const ka = Math.atan2(e.y - player.y, e.x - player.x);
        e.x += Math.cos(ka) * 30;
        e.y += Math.sin(ka) * 30;
      }
    }

    /* ---- 子弹更新 ---- */
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt * 60;
      b.y += b.vy * dt * 60;
      b.life -= dt;

      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        bullets.splice(i, 1);
        continue;
      }

      if (b.fromEnemy) {
        if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.r) {
          if (player.invuln <= 0) {
            damagePlayer();
            if (state === STATE.OVER) return;
          }
          bullets.splice(i, 1);
        }
        continue;
      }

      // 玩家子弹打敌人
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (Math.hypot(b.x - e.x, b.y - e.y) < b.r + e.r) {
          let dmg = b.dmg;
          if (e.el >= 0) dmg *= damageMultiplier(b.el, e.el);
          if (game.buffActive) dmg *= 2;

          if (e.shield > 0) {
            e.shield -= dmg;
            burst(b.x, b.y, '#ffffff', 4, 2);
            if (e.shield < 0) { e.hp += e.shield; e.shield = 0; }
          } else {
            e.hp -= dmg;
          }

          e.hitFlash = 0.12;
          const elColor = b.el >= 0 ? ELEMENTS[b.el].color : '#ffffff';
          burst(b.x, b.y, elColor, 5, 2.5);

          if (e.el >= 0 && damageMultiplier(b.el, e.el) === 3) {
            addFloatText(e.x, e.y - e.r - 6, '克制!', '#ffd76a');
            Sound.superHit();
          } else {
            Sound.hit();
          }

          bullets.splice(i, 1);

          if (e.hp <= 0) {
            game.kills++;
            game.combo++;
            if (game.combo > game.maxCombo) game.maxCombo = game.combo;
            const bonus = Math.floor(game.combo / 3);
            const gain = e.score + bonus * 5;
            game.score += gain;
            addFloatText(e.x, e.y, '+' + gain, '#8affa0');
            burst(e.x, e.y, elColor, 14, 4);
            game.shake = Math.max(game.shake, 0.4);
            enemies.splice(j, 1);
            Sound.kill();
          }
          break;
        }
      }
    }

    /* ---- 彩蛋触发：第 3 层开始后 ---- */
    if (!game.eggTriggered && game.floor >= 3 && game.timeLeft < 27) {
      triggerEgg();
    }
  }

  function damagePlayer() {
    game.hp--;
    player.invuln = 1.2;
    player.hitFlash = 0.4;
    game.shake = 1;
    game.combo = 0;
    burst(player.x, player.y, '#ff4a4a', 20, 4);
    Sound.hurt();
    if (game.hp <= 0) gameOver();
  }

  /* ========================================================
     渲染（像素风）
     ======================================================== */
  function drawPixelRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function drawPixelCircle(cx, cy, r, color) {
    const s = 3;
    const steps = Math.ceil(r / s);
    ctx.fillStyle = color;
    for (let i = -steps; i <= steps; i++) {
      for (let j = -steps; j <= steps; j++) {
        const px = i * s, py = j * s;
        if (px * px + py * py <= r * r) {
          ctx.fillRect(Math.round(cx + px), Math.round(cy + py), s, s);
        }
      }
    }
  }

  function drawPixelDiamond(cx, cy, r, color) {
    const s = 3;
    const steps = Math.ceil(r / s);
    ctx.fillStyle = color;
    for (let i = -steps; i <= steps; i++) {
      for (let j = -steps; j <= steps; j++) {
        const px = i * s, py = j * s;
        if (Math.abs(px) + Math.abs(py) <= r) {
          ctx.fillRect(Math.round(cx + px), Math.round(cy + py), s, s);
        }
      }
    }
  }

  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0f0f22');
    grad.addColorStop(1, '#1a1030');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 星空
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let i = 0; i < 60; i++) {
      const sx = (i * 137.5) % W;
      const sy = (i * 73.3 + game.time * 8) % H;
      ctx.fillRect(Math.round(sx), Math.round(sy), 2, 2);
    }

    // 网格
    ctx.strokeStyle = 'rgba(120,120,200,0.07)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawHUD() {
    // 字体随逻辑宽度缩放，保证不同屏幕上比例一致
    const fs = Math.round(W * 0.033);
    drawPixelRect(0, 0, W, UI.top, 'rgba(10,10,25,0.85)');

    ctx.font = 'bold ' + fs + 'px "Courier New", monospace';
    ctx.textBaseline = 'middle';

    const row1 = Math.round(UI.top * 0.32);
    const row2 = Math.round(UI.top * 0.70);
    const pad = Math.round(W * 0.025);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd76a';
    ctx.fillText('第' + game.floor + '层', pad, row1);
    ctx.fillStyle = game.timeLeft < 6 ? '#ff5a5a' : '#8ad0ff';
    ctx.fillText('⏱' + Math.ceil(game.timeLeft) + 's', pad, row2);

    ctx.textAlign = 'center';
    let hpStr = '';
    for (let i = 0; i < game.maxHp; i++) hpStr += i < game.hp ? '❤' : '♡';
    ctx.fillStyle = '#ff6a8a';
    ctx.fillText(hpStr, W / 2, row1);
    ctx.fillStyle = '#8affa0';
    ctx.fillText('⭐' + game.score, W / 2, row2);

    if (game.combo >= 3) {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffd76a';
      ctx.fillText('x' + game.combo + ' 连击', W - pad, row2);
    }
    if (game.buffActive) {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffd76a';
      ctx.fillText('共鸣×2', W - pad, row1);
    }

    const prog = 1 - game.timeLeft / 30;
    drawPixelRect(0, UI.top, W * prog, 3, game.timeLeft < 6 ? '#ff5a5a' : '#5ae0e0');
  }

  function drawPlayer() {
    const el = ELEMENTS[game.currentEl];
    const blink = player.invuln > 0 && Math.floor(game.time * 12) % 2 === 0;
    if (blink) return;

    const color = player.hitFlash > 0 ? '#ffffff' : el.color;
    ctx.globalAlpha = 0.3;
    drawPixelCircle(player.x, player.y, player.r + 5, el.glow);
    ctx.globalAlpha = 1;
    drawPixelCircle(player.x, player.y, player.r, color);
    drawPixelRect(player.x - 3, player.y - 3, 6, 6, '#ffffff');
  }

  function drawEnemies() {
    for (const e of enemies) {
      const elColor = e.el >= 0 ? ELEMENTS[e.el].color : '#9a9ab0';
      const color = e.hitFlash > 0 ? '#ffffff' : elColor;

      if (e.shield > 0) {
        ctx.globalAlpha = 0.5;
        drawPixelCircle(e.x, e.y, e.r + 4, '#ffffff');
        ctx.globalAlpha = 1;
      }

      if (e.type === 'ruin') {
        drawPixelRect(e.x - e.r, e.y - e.r, e.r * 2, e.r * 2, color);
        drawPixelRect(e.x - 4, e.y - 4, 8, 8, '#ff5a5a');
      } else if (e.type === 'brute') {
        drawPixelDiamond(e.x, e.y, e.r + 2, color);
      } else {
        drawPixelDiamond(e.x, e.y, e.r, color);
      }

      if (e.el >= 0) {
        ctx.font = '10px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ELEMENTS[e.el].icon, e.x, e.y + 1);
      }

      if (e.hp < e.maxHp || e.shield > 0) {
        const bw = e.r * 2;
        const ratio = Math.max(0, e.hp / e.maxHp);
        drawPixelRect(e.x - e.r, e.y - e.r - 8, bw, 3, '#333');
        drawPixelRect(e.x - e.r, e.y - e.r - 8, bw * ratio, 3, '#ff5a5a');
        if (e.maxShield > 0 && e.shield > 0) {
          const sr = e.shield / e.maxShield;
          drawPixelRect(e.x - e.r, e.y - e.r - 12, bw, 3, '#333');
          drawPixelRect(e.x - e.r, e.y - e.r - 12, bw * sr, 3, '#8ad0ff');
        }
      }
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      const color = b.fromEnemy ? '#ff5a5a' : (b.el >= 0 ? ELEMENTS[b.el].color : '#ffffff');
      ctx.globalAlpha = 0.4;
      drawPixelRect(b.x - b.vx * 2 - 2, b.y - b.vy * 2 - 2, 4, 4, color);
      ctx.globalAlpha = 1;
      drawPixelRect(b.x - 3, b.y - 3, 6, 6, color);
      if (!b.fromEnemy) drawPixelRect(b.x - 1, b.y - 1, 2, 2, '#ffffff');
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      drawPixelRect(p.x, p.y, p.size, p.size, p.color);
    }
    ctx.globalAlpha = 1;
  }

  function drawFloatTexts() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const f of floatTexts) {
      ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();

    if (game.shake > 0) {
      const s = game.shake * 5;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    drawBackground();
    drawBullets();
    drawEnemies();
    drawPlayer();
    drawParticles();
    drawFloatTexts();
    drawHUD();

    ctx.restore();

    if (game.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (game.flash * 0.8) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ========================================================
     主循环
     ======================================================== */
  let lastTime = 0;

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  /* ========================================================
     按钮绑定
     ======================================================== */
  document.getElementById('startBtn').addEventListener('click', () => {
    Sound.unlock();
    startGame();
  });
  document.getElementById('restartBtn').addEventListener('click', () => {
    Sound.unlock();
    startGame();
  });
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);
  document.getElementById('pauseBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (state === STATE.PLAYING) pauseGame();
    else if (state === STATE.PAUSED) resumeGame();
  });

  // 音效开关
  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    Sound.unlock();
    const next = !Sound.enabled;
    Sound.setEnabled(next);
    soundBtn.textContent = next ? '🔊' : '🔇';
    soundBtn.classList.toggle('off', !next);
  });

  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  // 首次用户交互时解锁音频（浏览器自动播放策略要求）
  function unlockAudioOnce() {
    Sound.unlock();
    document.removeEventListener('touchstart', unlockAudioOnce);
    document.removeEventListener('mousedown', unlockAudioOnce);
    document.removeEventListener('keydown', unlockAudioOnce);
  }
  document.addEventListener('touchstart', unlockAudioOnce, { passive: true });
  document.addEventListener('mousedown', unlockAudioOnce);
  document.addEventListener('keydown', unlockAudioOnce);

  /* ========================================================
     调试接口（可选，便于开发时检查状态）
     ======================================================== */
  window.__game = {
    get state() { return state; },
    get data() { return game; },
    get enemies() { return enemies; },
    get bullets() { return bullets; },
    get player() { return player; },
    start: startGame,
    triggerEgg: triggerEgg,
    closeEgg: closeEgg,
    nextFloor: nextFloor,
    setElement: setElement,
    damageMultiplier: damageMultiplier,
    STATE: STATE
  };

  /* ========================================================
     启动
     ======================================================== */
  resize();
  player = createPlayer();
  setElement(0);
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
