<script src="common.js"></script>
<script>
(function () {
  var lines = [];
  lines.push('<div class="dim">日期　　　　值班人　　备注</div>');
  lines.push('<div class="dim">──────────────────────────────────────</div>');

  // 2004–2010：手写体（用楷体模拟）
  var early = [
    [2004, '李维', '我不上去了'],
    [2005, '—', '未安排'],
    [2006, '—', '未安排'],
    [2007, '王守义', '键坏了，门打不开'],
    [2008, '—', '未安排'],
    [2009, '—', '未安排'],
    [2010, '—', '未安排']
  ];
  for (var i = 0; i < early.length; i++) {
    var e = early[i];
    lines.push('<div style="font-family:楷体,KaiTi,serif;">' +
      e[0] + '　　　　' + e[1] + '　　　　' + e[2] + '</div>');
  }

  lines.push('<div class="dim">──── 以下为电子表格 ────</div>');

  // 2011–2023：每年一模一样的一行
  for (var y = 2011; y <= 2023; y++) {
    var note = (y === 2013) ? '陈敏　上去过一次' : '—　　未安排';
    lines.push('<div>' + y + '　　　　' + note + '</div>');
  }

  // 今天
  lines.push('<div class="danger">' + new Date().getFullYear() +
    '　　　　—　　未安排　　<span class="dim">（今日）</span></div>');

  document.getElementById('logBox').innerHTML = lines.join('');

  // 滚到底部解锁成就
  window.addEventListener('scroll', function () {
    var doc = document.documentElement;
    if (window.innerHeight + window.scrollY >= doc.scrollHeight - 60) {
      unlockAch('a07');
    }
  });
})();

markPage('log');
</script>
